<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой проект на GitHub</title>
    <style>
        /* Главный скролл всей страницы */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden; 
            overflow-y: auto; /* Страница свободно листается вниз */
            background-color: #180f2b;
            scroll-behavior: auto;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* 1. ПЕРВАЯ КАРТИНКА (Влетает и исчезает с 0с до 3с) */
        .zoom-image {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            display: block;
            z-index: 5;
            position: fixed; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.01);
            opacity: 0;

            animation: zoomAndFadeOutIntro 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes zoomAndFadeOutIntro {
            0% { transform: translate(-50%, -50%) scale(0.01); opacity: 0; }
            15% { opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1.8); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
        }

        /* 2. КОНТЕЙНЕР ДЛЯ ТРЕХ ИЗОБРАЖЕНИЙ 47.png */
        .triple-container {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 4;
            animation: fadeOutContainer 1s ease-in-out 6s forwards;
            opacity: 1;
            pointer-events: none;
        }

        .triple-container img {
            width: 100%;
            height: 33.33vh; 
            object-fit: cover;
            opacity: 0;
            animation: fadeInRow 1s ease-in-out forwards;
        }

        .triple-container img:nth-child(1) { animation-delay: 3s; }
        .triple-container img:nth-child(2) { animation-delay: 4s; }
        .triple-container img:nth-child(3) { animation-delay: 5s; }

        @keyframes fadeInRow {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeOutContainer {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ГЛАВНЫЙ РОДИТЕЛЬСКИЙ КОНТЕЙНЕР ДЛЯ ПЕРВОГО ЭКРАНА */
        .first-screen-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Занимает ровно один экран */
            z-index: 1;
            flex-shrink: 0;
        }

        /* 3. ФИНАЛЬНЫЙ ФОН 46.jpg */
        .full-screen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            animation: fadeInBackground 1.5s ease-in-out 7s forwards;
            opacity: 0;
        }

        @keyframes fadeInBackground {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 4. БОКОВЫЕ ЭЛЕМЕНТЫ ВВЕРХУ 48.gif */
        .side-element {
            position: absolute; 
            top: 15%;
            width: 35vw; 
            height: auto;
            z-index: 2;
            opacity: 0;
            pointer-events: none; 
            
            animation: fadeInElements 1s ease-in-out 9.5s forwards;
        }

        .side-element.left {
            left: 2%;
            transform: scaleX(-1);
        }

        .side-element.right {
            right: 2%;
        }

        /* КЛАСС ДЛЯ НИЖНИХ ЭЛЕМЕНТОВ 49.gif */
        .bottom-element {
            position: absolute; 
            bottom: 10%; 
            width: 70vw; 
            height: auto;
            z-index: 2;
            opacity: 0;
            pointer-events: none; 

            animation: fadeInElements 1s ease-in-out 9.5s forwards;
        }

        .bottom-element.left {
            left: -15%; 
            transform: scaleX(-1); 
        }

        .bottom-element.right {
            right: -15%; 
        }

        @keyframes fadeInElements {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 5. ПОДНЯТАЯ ВЫШЕ В КОДЕ КНОПКА ПЛЕЕРА (#f5cef5) */
        .audio-player-container {
            position: absolute; 
            top: 20%; /* Изначальное точное положение над 46.jpg */
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            z-index: 99999; /* Максимальный приоритет */
            opacity: 0;
            
            animation: fadeInPlayer 1s ease-in-out 9.5s forwards;
        }

        /* Крупная круглая розовая кнопка */
        .pink-play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(245, 206, 245, 0.25); 
            border: 4px solid #f5cef5; 
            box-shadow: 0px 0px 25px rgba(245, 206, 245, 0.7), inset 0px 0px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            padding: 0;
            outline: none;
        }

        .pink-play-btn:hover {
            transform: scale(1.05);
            background: rgba(245, 206, 245, 0.45);
            box-shadow: 0px 0px 35px #f5cef5;
        }

        /* Иконка треугольника */
        .pink-icon-play {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 18px 0 18px 28px;
            border-color: transparent transparent transparent #f5cef5; 
            margin-left: 8px; 
            display: block;
        }

        /* Иконка двух полосок (PAUSE) */
        .pink-icon-pause {
            width: 24px;
            height: 32px;
            display: none;
            justify-content: space-between;
        }

        .pink-icon-pause::before, .pink-icon-pause::after {
            content: '';
            width: 7px;
            height: 100%;
            background-color: #f5cef5; 
            border-radius: 3px;
        }

        /* Состояние проигрывания */
        .pink-play-btn.playing .pink-icon-play { display: none; }
        .pink-play-btn.playing .pink-icon-pause { display: flex; }

        @keyframes fadeInPlayer {
            0% { opacity: 0; transform: translateX(-50%) scale(0.9); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* КОНТЕЙНЕР ДЛЯ 50.jpg И ВИДЕО 5b.mp4 */
        .next-bg-container {
            position: relative;
            width: 100%;
            height: 37.5vh;
            z-index: 1;
            opacity: 0;
            animation: fadeInNextBg 1s ease-in-out 10.5s forwards;
            flex-shrink: 0;
        }

        @keyframes fadeInNextBg {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ИЗОБРАЖЕНИЕ 50.jpg */
        .next-bg {
            width: 100%;
            height: 100%; 
            object-fit: contain; 
            display: block;
            margin: 0 auto;
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ВИДЕО 5b.mp4 контейнер */
        .video-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            z-index: 999999;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0.15;
            transition: opacity 0.3s ease-in-out;
        }

        .video-wrapper.playing {
            opacity: 1;
            background: transparent;
        }

        .overlay-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        /* Видимая кнопка плей */
        .video-play-button {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(245, 206, 245, 0.9);
            border: 3px solid rgba(245, 206, 245, 1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000001;
            transition: all 0.2s ease-in-out;
            box-shadow: 0px 0px 30px rgba(245, 206, 245, 0.8);
            padding: 0;
        }

        .video-play-button:active {
            transform: scale(0.95);
        }

        .video-play-button:hover {
            background: rgba(245, 206, 245, 1);
            transform: scale(1.15);
            box-shadow: 0px 0px 40px rgba(245, 206, 245, 1);
        }

        .video-play-button span {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 24px 0 24px 40px;
            border-color: transparent transparent transparent #180f2b;
            margin-left: 10px;
        }

        .video-wrapper.playing .video-play-button {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="audioTrack" src="music.mp3" type="audio/mpeg" preload="auto"></audio>

    <img src="45.png" alt="Приближающееся изображение" class="zoom-image">

    <div class="triple-container">
        <img src="47.png" alt="Полоса 1">
        <img src="47.png" alt="Полоса 3">
        <img src="47.png" alt="Полоса 2">
    </div>

    <div class="audio-player-container">
        <button class="pink-play-btn" id="musicBtn" aria-label="Play/Pause">
            <div class="pink-icon-play"></div>
            <div class="pink-icon-pause"></div>
        </button>
    </div>

    <div class="first-screen-container">
        <img src="46.jpg" alt="Фон страницы" class="full-screen-bg">

        <img src="48.gif" alt="Левый верхний элемент" class="side-element left">
        <img src="48.gif" alt="Правый верхний элемент" class="side-element right">

        <img src="49.gif" alt="Левый нижний элемент" class="bottom-element left">
        <img src="49.gif" alt="Правый нижний элемент" class="bottom-element right">
    </div>

    <div class="next-bg-container">
        <img src="50.jpg" alt="Следующее изображение ниже" class="next-bg">
        <div class="video-wrapper" id="videoWrapper">
            <video id="overlayVideo" class="overlay-video" playsinline webkit-playsinline muted></video>
            <button class="video-play-button" id="videoPlayBtn" type="button"><span></span></button>
        </div>
    </div>

    <script>
        const musicBtn = document.getElementById('musicBtn');
        const audioTrack = document.getElementById('audioTrack');
        const overlayVideo = document.getElementById('overlayVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const videoPlayBtn = document.getElementById('videoPlayBtn');

        // Установка источника видео с абсолютным путём
        const videoSource = document.createElement('source');
        videoSource.src = './5b.mp4';
        videoSource.type = 'video/mp4';
        overlayVideo.appendChild(videoSource);

        console.log('Видео инициализировано:', overlayVideo.src);

        // Клик по кнопке плей - отключаем muted для запуска
        videoPlayBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('Клик на кнопку плей видео');
            
            overlayVideo.muted = false;
            overlayVideo.play().then(() => {
                console.log('Видео успешно запущено');
            }).catch(err => {
                console.error('Ошибка при воспроизведении:', err);
                // Пробуем ещё раз
                setTimeout(() => {
                    overlayVideo.play().catch(e => console.error('Повторная ошибка:', e));
                }, 100);
            });
        });

        // Клик по самому видео для паузы/плея
        overlayVideo.addEventListener('click', function(e) {
            e.stopPropagation();
            if (overlayVideo.paused) {
                overlayVideo.play();
            } else {
                overlayVideo.pause();
            }
        });

        musicBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            if (audioTrack.paused) {
                audioTrack.play()
                    .then(() => {
                        musicBtn.classList.add('playing');
                    })
                    .catch(err => {
                        console.error("Ошибка автоигры, пробуем перезапуск:", err);
                        audioTrack.load();
                        setTimeout(() => {
                            audioTrack.play().then(() => {
                                musicBtn.classList.add('playing');
                            });
                        }, 50);
                    });
            } else {
                audioTrack.pause();
                musicBtn.classList.remove('playing');
            }
        });

        audioTrack.addEventListener('ended', function() {
            musicBtn.classList.remove('playing');
        });

        // Обработчики для видео
        overlayVideo.addEventListener('play', function() {
            console.log('Видео воспроизводится');
            videoWrapper.classList.add('playing');
        });

        overlayVideo.addEventListener('pause', function() {
            console.log('Видео на паузе');
            videoWrapper.classList.remove('playing');
        });

        overlayVideo.addEventListener('ended', function() {
            console.log('Видео закончилось');
            videoWrapper.classList.remove('playing');
        });

        overlayVideo.addEventListener('error', function(e) {
            console.error('Ошибка загрузки видео:', e);
            if (overlayVideo.error) {
                console.error('Код ошибки:', overlayVideo.error.code);
                console.error('Сообщение:', overlayVideo.error.message);
            }
        });

        overlayVideo.addEventListener('loadstart', function() {
            console.log('Начало загрузки видео');
        });

        overlayVideo.addEventListener('canplay', function() {
            console.log('Видео готово к воспроизведению');
        });

        overlayVideo.addEventListener('loadedmetadata', function() {
            console.log('Метаданные видео загружены:', {
                duration: overlayVideo.duration,
                width: overlayVideo.videoWidth,
                height: overlayVideo.videoHeight
            });
        });
    </script>

</body>
</html>
