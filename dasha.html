<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой проект на GitHub</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #180f2b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* 1. ПЕРВАЯ КАРТИНКА */
        .zoom-image {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            display: block;
            z-index: 5;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.01);
            opacity: 0;
            animation: zoomAndFadeOutIntro 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes zoomAndFadeOutIntro {
            0% { transform: translate(-50%, -50%) scale(0.01); opacity: 0; }
            15% { opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1.8); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
        }

        /* 2. ТРОЙНОЙ КОНТЕЙНЕР */
        .triple-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 4;
            animation: fadeOutContainer 1s ease-in-out 6s forwards;
            opacity: 1;
            pointer-events: none;
        }

        .triple-container img {
            width: 100%;
            height: 33.33vh;
            object-fit: cover;
            opacity: 0;
            animation: fadeInRow 1s ease-in-out forwards;
        }

        .triple-container img:nth-child(1) { animation-delay: 3s; }
        .triple-container img:nth-child(2) { animation-delay: 4s; }
        .triple-container img:nth-child(3) { animation-delay: 5s; }

        @keyframes fadeInRow {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeOutContainer {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР ПЕРВОГО ЭКРАНА */
        .first-screen-container {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* 3. ФОН 46.jpg */
        .full-screen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            animation: fadeInBackground 1.5s ease-in-out 7s forwards;
            opacity: 0;
        }

        @keyframes fadeInBackground {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 4. БОКОВЫЕ ЭЛЕМЕНТЫ */
        .side-element {
            position: absolute;
            top: 15%;
            width: 35vw;
            height: auto;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            animation: fadeInElements 1s ease-in-out 9.5s forwards;
        }

        .side-element.left {
            left: 2%;
            transform: scaleX(-1);
        }

        .side-element.right {
            right: 2%;
        }

        .bottom-element {
            position: absolute;
            bottom: 10%;
            width: 70vw;
            height: auto;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            animation: fadeInElements 1s ease-in-out 9.5s forwards;
        }

        .bottom-element.left {
            left: -15%;
            transform: scaleX(-1);
        }

        .bottom-element.right {
            right: -15%;
        }

        @keyframes fadeInElements {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 5. АУДИО ПЛЕЕР */
        .audio-player-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            z-index: 99999;
            opacity: 0;
            animation: fadeInPlayer 1s ease-in-out 9.5s forwards;
        }

        .pink-play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(245, 206, 245, 0.25);
            border: 4px solid #f5cef5;
            box-shadow: 0px 0px 25px rgba(245, 206, 245, 0.7), inset 0px 0px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            padding: 0;
            outline: none;
        }

        .pink-play-btn:hover {
            transform: scale(1.05);
            background: rgba(245, 206, 245, 0.45);
            box-shadow: 0px 0px 35px #f5cef5;
        }

        .pink-icon-play {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 18px 0 18px 28px;
            border-color: transparent transparent transparent #f5cef5;
            margin-left: 8px;
            display: block;
        }

        .pink-icon-pause {
            width: 24px;
            height: 32px;
            display: none;
            justify-content: space-between;
        }

        .pink-icon-pause::before, .pink-icon-pause::after {
            content: '';
            width: 7px;
            height: 100%;
            background-color: #f5cef5;
            border-radius: 3px;
        }

        .pink-play-btn.playing .pink-icon-play { display: none; }
        .pink-play-btn.playing .pink-icon-pause { display: flex; }

        @keyframes fadeInPlayer {
            0% { opacity: 0; transform: translateX(-50%) scale(0.9); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* ======================================
           БЛОК: 50.jpg + ВИДЕО ПОВЕРХ
        ====================================== */

        /* Обёртка — позиционирующий контейнер */
        .media-block {
            position: relative;
            width: 100%;
            /* Высота подстраивается под 50.jpg (contain) */
        }

        /* 50.jpg — базовый слой */
        .next-bg {
            width: 100%;
            height: 37.5vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Видео — поверх 50.jpg */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;

            /* Стандартный Safari-плеер: просто video без обёрток */
            display: block;

            /* Обязательно для Safari на iOS — иначе открывает fullscreen */
            -webkit-playsinline: true;
        }
    </style>
</head>
<body>

    <!--
        АУДИО: preload="metadata" вместо "auto" —
        меньше конфликтов с видео за медиа-ресурсы в Safari
    -->
    <audio id="audioTrack" src="music.mp3" preload="metadata"></audio>

    <img src="45.png" alt="Приближающееся изображение" class="zoom-image">

    <div class="triple-container">
        <img src="47.png" alt="Полоса 1">
        <img src="47.png" alt="Полоса 2">
        <img src="47.png" alt="Полоса 3">
    </div>

    <div class="audio-player-container">
        <button class="pink-play-btn" id="musicBtn" aria-label="Play/Pause">
            <div class="pink-icon-play"></div>
            <div class="pink-icon-pause"></div>
        </button>
    </div>

    <div class="first-screen-container">
        <img src="46.jpg" alt="Фон страницы" class="full-screen-bg">
        <img src="48.gif" alt="Левый верхний элемент" class="side-element left">
        <img src="48.gif" alt="Правый верхний элемент" class="side-element right">
        <img src="49.gif" alt="Левый нижний элемент" class="bottom-element left">
        <img src="49.gif" alt="Правый нижний элемент" class="bottom-element right">
    </div>

    <!-- БЛОК: изображение 50.jpg + видео 5b.mp4 поверх него -->
    <div class="media-block">
        <img src="50.jpg" alt="Следующее изображение" class="next-bg">

        <!--
            КЛЮЧЕВЫЕ АТРИБУТЫ ДЛЯ SAFARI:
            - playsinline: видео остаётся на странице, не открывает fullscreen
            - controls: стандартный нативный плеер браузера
            - preload="metadata": не грузит всё сразу, не конфликтует с аудио
            - webkit-playsinline: старый Safari (iOS < 10)
            БЕЗ autoplay и БЕЗ muted — пусть пользователь запускает сам
        -->
        <video
            class="video-overlay"
            src="5b.mp4"
            controls
            playsinline
            webkit-playsinline
            preload="metadata"
            type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <script>
        const musicBtn = document.getElementById('musicBtn');
        const audioTrack = document.getElementById('audioTrack');

        musicBtn.addEventListener('click', function(e) {
            e.preventDefault();

            if (audioTrack.paused) {
                audioTrack.play()
                    .then(() => {
                        musicBtn.classList.add('playing');
                    })
                    .catch(err => {
                        console.error("Ошибка воспроизведения:", err);
                        audioTrack.load();
                        setTimeout(() => {
                            audioTrack.play().then(() => {
                                musicBtn.classList.add('playing');
                            });
                        }, 50);
                    });
            } else {
                audioTrack.pause();
                musicBtn.classList.remove('playing');
            }
        });

        audioTrack.addEventListener('ended', function() {
            musicBtn.classList.remove('playing');
        });
    </script>

</body>
</html>
