<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой проект на GitHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marck+Script&display=swap" rel="stylesheet">
    
    <style>
        /* Главный скролл всей страницы */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden; 
            overflow-y: auto; /* Страница свободно листается вниз */
            background-color: #180f2b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* === ЗАСТАВКА: ДИСКО-ПРОЖЕКТОРА (Длится 6 секунд) === */
        .spotlight-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0616; /* Темный фон для максимального контраста лучей */
            z-index: 999999;
            overflow: hidden;
            pointer-events: none;
            animation: fadeOutIntro 1.2s cubic-bezier(0.4, 0, 0.2, 1) 5s forwards;
        }

        /* КОНТЕЙНЕР ДЛЯ КАЖДОГО ПРОЖЕКТОРА (Луч + Круг вместе) */
        .spotlight-group {
            position: absolute;
            top: 0;
            width: 40vw;
            height: 100vh;
            transform-origin: top center; /* Качаемся от верхней точки экрана */
            mix-blend-mode: screen;
        }

        /* Стили для конуса луча */
        .ray {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.55;
            filter: blur(2px);
        }

        /* Стили для круга на полу (ПОДНЯТ ВЫШЕ И ЗАКРЕПЛЕН ПО ЦЕНТРУ ЛУЧА) */
        .floor-light {
            position: absolute;
            bottom: 6vh; /* Подняли круги чуть выше от нижнего края экрана */
            left: 50%;
            transform: translateX(-50%); /* Строго по центру конуса луча */
            width: 24vw;
            height: 10vh;
            border-radius: 50%;
            opacity: 0.75;
            filter: blur(20px);
        }

        /* НАСТРОЙКА ПОЗИЦИЙ, ЦВЕТОВ И ИНДИВИДУАЛЬНЫХ АНИМАЦИЙ */

        /* КРАСНЫЙ ПРОЖЕКТОР (Слева) */
        .spotlight-red {
            left: 15%;
            animation: swingRed 4s ease-in-out infinite alternate;
        }
        .spotlight-red .ray {
            background: linear-gradient(to bottom, rgba(255, 30, 30, 0.8) 0%, rgba(255, 30, 30, 0.1) 75%, transparent 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .spotlight-red .floor-light {
            background: radial-gradient(circle, rgba(255, 30, 30, 1) 0%, rgba(255, 30, 30, 0) 70%);
        }

        /* ЖЕЛТЫЙ ПРОЖЕКТОР (Центр) */
        .spotlight-yellow {
            left: 50%;
            margin-left: -20vw;
            animation: swingYellow 3.2s ease-in-out infinite alternate-reverse;
        }
        .spotlight-yellow .ray {
            background: linear-gradient(to bottom, rgba(255, 230, 0, 0.75) 0%, rgba(255, 230, 0, 0.1) 75%, transparent 100%);
            clip-path: polygon(50% 0%, 8% 100%, 92% 100%);
        }
        .spotlight-yellow .floor-light {
            background: radial-gradient(circle, rgba(255, 230, 0, 1) 0%, rgba(255, 230, 0, 0) 70%);
        }

        /* ЗЕЛЕНЫЙ ПРОЖЕКТОР (Справа) */
        .spotlight-green {
            right: 15%;
            animation: swingGreen 4.5s ease-in-out infinite alternate;
        }
        .spotlight-green .ray {
            background: linear-gradient(to bottom, rgba(0, 255, 100, 0.7) 0%, rgba(0, 255, 100, 0.1) 75%, transparent 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .spotlight-green .floor-light {
            background: radial-gradient(circle, rgba(0, 255, 100, 1) 0%, rgba(0, 255, 100, 0) 70%);
        }

        /* СИНХРОННЫЕ АНИМАЦИИ НАКЛОНА ДЛЯ КАЖДОЙ ГРУППЫ */
        @keyframes swingRed {
            0% { transform: rotate(-14deg) scaleX(0.85); }
            100% { transform: rotate(10deg) scaleX(1.15); }
        }

        @keyframes swingYellow {
            0% { transform: rotate(-18deg) scaleX(1.1); }
            100% { transform: rotate(18deg) scaleX(1.1); }
        }

        @keyframes swingGreen {
            0% { transform: rotate(-10deg) scaleX(1.15); }
            100% { transform: rotate(15deg) scaleX(0.85); }
        }

        /* Исчезновение всей заставки */
        @keyframes fadeOutIntro {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }


        /* === ОСНОВНОЙ КОНТЕНТ (Появляется после заставки) === */

        /* ГЛАВНЫЙ РОДИТЕЛЬСКИЙ КОНТЕЙНЕР ДЛЯ ПЕРВОГО ЭКРАНА */
        .first-screen-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Занимает ровно один экран */
            z-index: 1;
        }

        /* ФИНАЛЬНЫЙ ФОН 46.jpg */
        .full-screen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            animation: fadeInBackground 1.5s ease-in-out 5s forwards; /* Синхронизировано с уходом прожекторов */
            opacity: 0;
        }

        @keyframes fadeInBackground {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* БОКОВЫЕ ЭЛЕМЕНТЫ ВВЕРХУ 48.gif */
        .side-element {
            position: absolute; 
            top: 15%;
            width: 35vw; 
            height: auto;
            z-index: 2;
            opacity: 0;
            pointer-events: none; 
            
            animation: fadeInElements 1s ease-in-out 5.5s forwards;
        }

        .side-element.left {
            left: 2%;
            transform: scaleX(-1);
        }

        .side-element.right {
            right: 2%;
        }

        /* КЛАСС ДЛЯ НИЖНИХ ЭЛЕМЕНТОВ 49.gif */
        .bottom-element {
            position: absolute; 
            bottom: 10%; 
            width: 70vw; 
            height: auto;
            z-index: 2;
            opacity: 0;
            pointer-events: none; 

            animation: fadeInElements 1s ease-in-out 5.5s forwards;
        }

        .bottom-element.left {
            left: -15%; 
            transform: scaleX(-1); 
        }

        .bottom-element.right {
            right: -15%; 
        }

        @keyframes fadeInElements {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* КНОПКА АУДИОПЛЕЕРА */
        .audio-player-container {
            position: absolute; 
            top: 1%; 
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            z-index: 99999; 
            opacity: 0;
            
            animation: fadeInPlayer 1s ease-in-out 5.5s forwards;
        }

        .pink-play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(245, 206, 245, 0.25); 
            border: 4px solid #f5cef5; 
            box-shadow: 0px 0px 25px rgba(245, 206, 245, 0.7), inset 0px 0px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            padding: 0;
            outline: none;
        }

        .pink-play-btn:hover {
            transform: scale(1.05);
            background: rgba(245, 206, 245, 0.45);
            box-shadow: 0px 0px 35px #f5cef5;
        }

        .pink-icon-play {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 18px 0 18px 28px;
            border-color: transparent transparent transparent #f5cef5; 
            margin-left: 8px; 
            display: block;
        }

        .pink-icon-pause {
            width: 24px;
            height: 32px;
            display: none;
            justify-content: space-between;
        }

        .pink-icon-pause::before, .pink-icon-pause::after {
            content: '';
            width: 7px;
            height: 100%;
            background-color: #f5cef5; 
            border-radius: 3px;
        }

        .pink-play-btn.playing .pink-icon-play { display: none; }
        .pink-play-btn.playing .pink-icon-pause { display: flex; }

        @keyframes fadeInPlayer {
            0% { opacity: 0; transform: translateX(-50%) scale(0.9); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* ПОЛНОСТЬЮ СЕПАРИРОВАННЫЙ БЛОК ДЛЯ ВТОРОГО ЭКРАНА (ВИДЕО + 50.jpg) */
        .video-section-wrapper {
            position: relative;
            width: 100%;
            margin-top: 0vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; 
        }

        /* Изображение 50.jpg */
        .next-bg {
            width: 100%;
            max-width: 100vw;
            height: auto; 
            display: block;
        }

        /* Видеоплеер 5b.mp4 наложен строго ПОВЕРХ 50.jpg и сделан МЕНЬШЕ */
        .overlay-video-player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            width: 80%; 
            height: 80%; 
            object-fit: contain; 
            border-radius: 8px; 
            z-index: 20; 
        }

        /* СЕКЦИЯ С ЦИКЛИЧНЫМ ФОНОМ 51.jpg И ТЕКСТОМ */
        .astrology-section {
            width: 100%;
            background-image: url('51.jpg');
            background-repeat: repeat-y; 
            background-size: 100% auto;
            position: relative;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px; 
        }

        /* Заголовок Natal chart */
        .natal-chart-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.5rem, 8vw, 6rem); 
            color: #b877b1;
            margin: 40px 0 20px 0;
            text-align: center;
            text-shadow: 0 0 15px rgba(184, 119, 177, 0.4);
        }

        /* Подложка-прямоугольник (Цвет #400f1a, прозрачность 60%) */
        .text-overlay-card {
            width: 88%;
            max-width: 900px;
            background-color: rgba(64, 15, 26, 0.6); 
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Стилизация изображений 52.png и 53.png внутри подложки */
        .astro-card-img {
            width: 100%;
            max-width: 650px;
            height: auto;
            display: block;
            border-radius: 10px;
            margin-bottom: 25px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Блок со свитком натального текста */
        .astro-content-text {
            font-family: 'Marck Script', cursive;
            color: #b877b1; 
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            line-height: 1.6;
            text-align: justify;
            width: 100%;
            margin-top: 15px;
            word-spacing: -1px; 
        }

        /* Форматирование названий аспектов */
        .astro-content-text h3 {
            font-size: clamp(1.6rem, 4.5vw, 2.2rem);
            margin: 35px 0 15px 0;
            text-align: center;
            border-bottom: 1px dashed rgba(189, 106, 125, 0.4); 
            padding-bottom: 8px;
            font-weight: normal;
        }
        
        .astro-content-text h3:first-of-type {
            margin-top: 10px;
        }

        /* Абзацы текста */
        .astro-content-text p {
            margin: 0 0 20px 0;
            text-indent: 20px; 
        }

        /* Стили для финальной надписи в самом низу */
        .footer-quote-text {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 7vw, 5rem); 
            color: #bd6a7d; 
            margin-top: 40px; 
            text-align: center;
            text-shadow: 0 0 15px rgba(189, 106, 125, 0.3);
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="spotlight-intro">
        
        <div class="spotlight-group spotlight-red">
            <div class="ray"></div>
            <div class="floor-light"></div>
        </div>
        
        <div class="spotlight-group spotlight-yellow">
            <div class="ray"></div>
            <div class="floor-light"></div>
        </div>
        
        <div class="spotlight-group spotlight-green">
            <div class="ray"></div>
            <div class="floor-light"></div>
        </div>

    </div>

    <audio id="audioTrack" src="music.mp3" type="audio/mpeg" preload="auto"></audio>

    <div class="audio-player-container">
        <button class="pink-play-btn" id="musicBtn" aria-label="Play/Pause">
            <div class="pink-icon-play"></div>
            <div class="pink-icon-pause"></div>
        </button>
    </div>

    <div class="first-screen-container">
        <img src="46.jpg" alt="Фон страницы" class="full-screen-bg">

        <img src="48.gif" alt="Левый верхний элемент" class="side-element left">
        <img src="48.gif" alt="Правый верхний элемент" class="side-element right">

        <img src="49.gif" alt="Левый нижний элемент" class="bottom-element left">
        <img src="49.gif" alt="Правый нижний элемент" class="bottom-element right">
    </div>

    <div class="video-section-wrapper">
